apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-training
  namespace: mlops
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: cifar10-training
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
      containers:
        - name: training
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: TRAINING_CONFIG
              value: /app/configs/training_config.yaml
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: model-storage
              mountPath: /app/checkpoints
            - name: dataset
              mountPath: /app/data
              subPath: data
              readOnly: false
      volumes:
        - name: config
          configMap:
            name: training-config
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-storage
        - name: dataset
          persistentVolumeClaim:
            claimName: model-storage
